name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      # A GitHub App token is used so the release PR and its merge trigger
      # the Build workflow (GITHUB_TOKEN events don't trigger workflows).
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bump version
        id: version
        run: |
          version=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=release/$version" >> "$GITHUB_OUTPUT"

      - name: Create release PR with auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "${{ steps.version.outputs.branch }}"
          git commit -am "chore: release ${{ steps.version.outputs.version }}"
          git push -u origin "${{ steps.version.outputs.branch }}"
          url=$(gh pr create \
            --base main \
            --head "${{ steps.version.outputs.branch }}" \
            --title "chore: release ${{ steps.version.outputs.version }}" \
            --body "Automated ${{ inputs.bump }} release, triggered by @${{ github.actor }}.")
          gh pr merge "$url" --auto --squash
          echo "Release PR: $url" >> "$GITHUB_STEP_SUMMARY"
